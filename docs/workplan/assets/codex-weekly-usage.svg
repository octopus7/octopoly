<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Codex 주간 사용량 (%)</title>
  <desc id="chart-desc">2026년 8월 9일 22시부터 8월 10일 5시 30분까지의 절대 시간축에 표시한 Codex 주간 사용량 선 그래프. 관측값은 22시 10분 10퍼센트에서 5시 20분 30퍼센트까지 증가하며 마지막 10분은 빈 공간이다.</desc>
