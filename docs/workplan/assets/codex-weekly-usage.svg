    .chart-bg { fill: #f8fafc; }
    .chart-frame { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
    .grid { stroke: #cbd5e1; stroke-width: 1; }
    .axis { stroke: #64748b; stroke-width: 1.5; }
    .axis-text, .axis-title, .chart-title, .date-label, .value-label { fill: #0f172a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .axis-text { font-size: 15px; }
    .axis-title { font-size: 17px; font-weight: 600; }
    .chart-title { font-size: 24px; font-weight: 700; }
    .date-boundary { stroke: #2563eb; stroke-width: 2; stroke-dasharray: 7 5; }
    .date-label { font-size: 14px; font-weight: 700; fill: #1e40af; }
    .usage-line { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .usage-point { fill: #60a5fa; stroke: #1e40af; stroke-width: 2.5; }
    .value-label { font-size: 15px; font-weight: 700; fill: #1e40af; }
    @media (prefers-color-scheme: dark) {
      .chart-bg { fill: #0f172a; }
      .chart-frame { stroke: #64748b; }
      .grid { stroke: #334155; }
      .axis { stroke: #94a3b8; }
      .axis-text, .axis-title, .chart-title, .value-label { fill: #e2e8f0; }
      .date-boundary { stroke: #60a5fa; }
      .date-label { fill: #93c5fd; }
      .usage-line { stroke: #60a5fa; }
      .usage-point { fill: #3b82f6; stroke: #bfdbfe; }
    }
  </style>

