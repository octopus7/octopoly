<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OctoPoly Workstream 16 Plane/Cube browser smoke</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10131a; color: #f7f8fb; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { display: grid; grid-template-columns: minmax(640px, 2fr) minmax(320px, 1fr); min-height: 100vh; }
      #smoke-viewport { position: relative; height: 640px; overflow: hidden; background: #171c27; }
      #smoke-canvas { display: block; width: 100%; height: 640px; }
      #smoke-panel { padding: 16px; overflow: auto; border-left: 1px solid #31394b; }
      #smoke-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-block: 12px; }
      button { min-height: 44px; padding: 8px 12px; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 12px; border: 1px solid #31394b; background: #0b0e14; }
      [data-status="pass"] { border-color: #32c779; }
      [data-status="fail"], [data-status="unsupported"] { border-color: #ff6577; }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; } #smoke-panel { border-left: 0; border-top: 1px solid #31394b; } }
    </style>
  </head>
  <body>
    <main data-testid="basic-primitives-browser-smoke">
      <section id="smoke-viewport" data-testid="viewport" aria-label="Basic primitives modeling viewport">
        <canvas id="smoke-canvas" data-testid="canvas" width="960" height="640" aria-label="OctoPoly basic primitives WebGL2 viewport"></canvas>
      </section>
      <aside id="smoke-panel">
        <h1>Workstream 16 — Plane/Cube</h1>
        <p>Use <code>?scenario=plane</code> or <code>?scenario=cube</code>, then drive the New Scene adapter and normalized-input controls.</p>
        <div id="smoke-controls" data-testid="stage1-controls" role="toolbar" aria-label="Stage 1 validation controls">
          <button type="button" data-testid="move-selection">Move selection</button>
          <button type="button" data-testid="extrude-selection">Extrude selection</button>
          <button type="button" data-testid="undo">Undo</button>
          <button type="button" data-testid="redo">Redo</button>
        </div>
        <pre id="smoke-result" data-testid="result" data-status="starting" aria-live="polite">Starting…</pre>
      </aside>
    </main>
    <script type="module" src="./browser-smoke.ts"></script>
  </body>
</html>
